upstream backend_cluster {
    least_conn; # Route traffic to instance with fewest active connections
    
    # Backend instances in high-availability cluster
    server backend-1:5000 max_fails=3 fail_timeout=10s;
    server backend-2:5000 max_fails=3 fail_timeout=10s;
    server backend-3:5000 max_fails=3 fail_timeout=10s;

    keepalive 64;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 15M;

    # Load Balancer Health Probe
    location /lb-health {
        access_log off;
        return 200 '{"status":"load_balancer_active","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Route all API traffic to healthy backend cluster
    location / {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;

        # Connection Keep-Alive
        proxy_set_header Connection "";

        # Client IP & Protocol Forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for heavy operations (AI generation, compilation)
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Automatic failover if an instance fails or returns 502/503/504
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }
}
